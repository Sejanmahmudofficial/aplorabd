<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AploraBD - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080914;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:linear-gradient(145deg,#21143a,#11162d);
  border:1px solid #40375b;
  border-radius:28px;
  padding:35px 25px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#c56cff;
}

.subtitle{
  text-align:center;
  color:#999caf;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.tab{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid #44455e;
  background:transparent;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#c56cff;
  color:#090914;
  border-color:#c56cff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#d8d8e2;
  font-size:14px;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #393b55;
  background:#0b0d1b;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#c56cff;
}

.submit{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#c56cff;
  color:#090914;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#aaaabd;
  text-decoration:none;
}

.back:hover{
  color:#c56cff;
}

.note{
  text-align:center;
  color:#777b91;
  font-size:12px;
  margin-top:20px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    Aplora<span>BD</span>
  </div>

  <p class="subtitle">Welcome to your social media panel</p>

  <div class="tabs">
    <button class="tab active" onclick="showForm('login',this)">
      Login
    </button>

    <button class="tab" onclick="showForm('register',this)">
      Register
    </button>
  </div>

  <div id="login" class="form active">

    <label>Email or Username</label>
    <input type="text" placeholder="Enter your email or username">

    <label>Password</label>
    <input type="password" placeholder="Enter your password">

    <button class="submit" onclick="demoMessage()">
      Login
    </button>

  </div>

  <div id="register" class="form">

    <label>Username</label>
    <input type="text" placeholder="Choose a username">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Password</label>
    <input type="password" placeholder="Create a password">

    <button class="submit" onclick="demoMessage()">
      Create Account
    </button>

  </div>

  <a href="index.html" class="back">
    ← Back to Home
  </a>

  <p class="note">
    Demo interface — real account authentication will be connected later.
  </p>

</div>

<script>

function showForm(id,button){

  document.querySelectorAll('.form')
    .forEach(form => form.classList.remove('active'));

  document.querySelectorAll('.tab')
    .forEach(tab => tab.classList.remove('active'));

  document.getElementById(id).classList.add('active');

  button.classList.add('active');
}

function demoMessage(){

  alert("Login/Register system will be connected after the backend is added.");

}

</script>

</body>
</html>
